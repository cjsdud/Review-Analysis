<svg width="960" height="180" viewBox="0 0 960 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rfTitle rfDesc">
  <title id="rfTitle">ReviewFit</title>
  <desc id="rfDesc">ReviewFit wordmark — REVIEW in navy, FIT in bright blue, transparent background</desc>

  <!-- REVIEW: dark navy -->
  <g fill="#0A1E4C">
    <!-- R: stem + top bar + right cap (ends at mid bar top) + mid bar + leg -->
    <rect x="30" y="15" width="32" height="150"/>
    <rect x="30" y="15" width="110" height="32"/>
    <rect x="108" y="15" width="32" height="60"/>
    <rect x="30" y="75" width="106" height="32"/>
    <polygon points="62,107 96,107 140,165 108,165"/>
    <!-- E1: stem + 3 bars (mid bar slightly shorter for display feel) -->
    <rect x="144" y="15" width="32" height="150"/>
    <rect x="144" y="15" width="92" height="32"/>
    <rect x="144" y="75" width="84" height="32"/>
    <rect x="144" y="133" width="92" height="32"/>
    <!-- V: single polygon with inner apex (negative space) and outer bottom point -->
    <polygon points="232,15 264,15 298,92 332,15 364,15 298,165"/>
    <!-- I1 -->
    <rect x="368" y="15" width="32" height="150"/>
    <!-- E2 -->
    <rect x="404" y="15" width="32" height="150"/>
    <rect x="404" y="15" width="92" height="32"/>
    <rect x="404" y="75" width="84" height="32"/>
    <rect x="404" y="133" width="92" height="32"/>
    <!-- W: single polygon outline with two outer negative Vs at top, a small diamond notch at peak center, and inner strokes converging at bottom-center (no bottom gap) -->
    <polygon points="492,15 524,15 545,112 560,75 572,75 578,87 584,75 596,75 611,112 632,15 664,15 631,165 525,165"/>
  </g>

  <!-- FIT: bright blue -->
  <g fill="#1B73E8">
    <!-- F: stem + top bar + mid bar -->
    <rect x="686" y="15" width="32" height="150"/>
    <rect x="686" y="15" width="92" height="32"/>
    <rect x="686" y="75" width="78" height="32"/>
    <!-- I2 -->
    <rect x="782" y="15" width="32" height="150"/>
    <!-- T: top bar + centered stem -->
    <rect x="818" y="15" width="112" height="32"/>
    <rect x="858" y="15" width="32" height="150"/>
  </g>
</svg>
